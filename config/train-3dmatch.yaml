
exp_name: 3dmatch

model: GTINet
dataset: 3dmatch 
model_path: ''
dim: 8
# -------------------------modelenet40-------------------
rot_factor: 4
gaussian_noise: False
unseen: False

# -------------------------icl_nuim----------------------
max_angle: 45
max_trans: 0.5
data_file_test: ./data/test/icl_nuim.h5
data_file: ./data/train/icl_nuim.h5

# -------------------------7scenes-----------------------
mode: train
mag: 1
workers: 4
dataset_path: ./7scene
categoryfile: ./data/categories/7scene_train.txt

# --------------------------kitti-------------------------
voxel_size: 0.3
root: /test/kitti_dataset/sequences/
data_list: ./data/kitti_list
augment: 1.0

# -------------------------3dmatch-----------------------
mode: train
dataset: 3dmatch
benchmark: 3DMatch
root: ./data/indoor
batch_size: 1 
num_workers: 4 
augment_noise: 0.005
train_info: ./config/indoor/train_info.pkl
val_info: ./config/indoor/val_info.pkl

# ----------------model hyper parameters------------------
nn_margin: 0.5 
loss_margin: 0.01 
list_k1: [8,8] 
list_k2: [8,8] 
emb_dims: 256     
n_iters: 1
batch_size: 1
test_batch_size: 1
n_points: 2048
n_subsampled_points: 2000
epochs: 100
use_sgd: False
n_keypoints: 768
momentum: 0.9
no_cuda: False
seed: 1234
start_epoch: 0
nhead: 4

perturb_pose: small
overlap_radius: 0.0375  # Distance below which points will be considered to be overlapping

reg_success_thresh_rot: 10
reg_success_thresh_trans: 0.1

#solver:
optimizer: AdamW
base_lr: 0.0001
lr: 0.0001
lr_step: [25,50,75]
weight_decay: 0.0001
grad_clip: 0.1
scheduler: 'step'
scheduler_param: [205860, 0.5]  # Decay by 0.5 every 20 epochs

# Use the same processing or backbone as Predator
#kpconv_options:
num_layers: 4
neighborhood_limits: [40, 40, 40, 40]
aggregation_mode: sum
first_subsampling_dl: 0.025
first_feats_dim: 128
fixed_kernel_points: center
in_feats_dim: 1
in_points_dim: 3
conv_radius: 2.5
deform_radius: 5.0
KP_extent: 2.0
KP_influence: linear
overlap_radius: 0.0375
use_batch_norm: True
batch_norm_momentum: 0.02
modulated: False
num_kernel_points: 15
architecture: ['simple',
                'resnetb',
                'resnetb_strided',
                'resnetb',
                'resnetb',
                'resnetb_strided',
                'resnetb',
                'resnetb',
                'resnetb_strided',
                'resnetb',
                'resnetb']
#train_options:
niter: -70  # Actually just need 40-50 epochs.
# ------------------network training-----------------------
resume: False

# ------------------network testing------------------------
eval: False
